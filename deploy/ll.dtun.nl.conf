# Love/Light Index: static site (+ optional helper backend).
#
#   ll.dtun.nl             -> /var/www/html/ll (static)
#   ll.dtun.nl/api/guide   -> ll-helper.service on 127.0.0.1:8791 (only if enabled)
#
# Public 443 belongs to sslh, which hands TLS to 127.0.0.1:14443 (see the
# forecast.dtun.nl vhost). DNS-only in Cloudflare. Certificate: certbot, cert-name ll.dtun.nl.

server {
    listen 80;
    listen [::]:80;
    server_name ll.dtun.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:14443 ssl;
    http2 on;
    server_name ll.dtun.nl;

    ssl_certificate /etc/letsencrypt/live/ll.dtun.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ll.dtun.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    port_in_redirect off;

    root /var/www/html/ll;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json
               application/xml text/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }

    # corpus.json is asked for as corpus.json?v=<build time> (see index.html), so a new
    # build is always a new URL and the old one can be cached for good. index.html and
    # index.json keep the short expires above, so a redeploy shows up within minutes.
    location = /corpus.json {
        try_files $uri =404;
        expires 30d;
    }

    # The noble helper. /api/guide/health stays local.
    location = /api/guide {
        limit_except GET POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
